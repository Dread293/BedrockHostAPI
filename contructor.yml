version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: bedrock_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - bedrock-net

  backend:
    build:
      context: ./BedrockHostAPI
      dockerfile: Dockerfile
    container_name: bedrock_backend
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=postgres_db;Port=5432;Database=bedrock_db;Username=postgres;Password=123456
    ports:
      - "8080:8080"
    depends_on:
      - postgres_db
    networks:
      - bedrock-net

volumes:
  pgdata:

networks:
  bedrock-net:
    driver: bridge